<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Michael Espinosa · Estratega Digital</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Panel personal de Michael Espinosa: trabajo, tareas, enlaces y finanzas.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Michael">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/portal.css">
</head>
<body>

<section id="login" class="hide">
  <form class="gbox" id="login-form">
    <img src="assets/logo-michael-espinosa.png" alt="Michael Espinosa, estratega digital" width="1869" height="527">
    <h1>Todo lo mío, <em>en un solo lugar</em></h1>
    <p>Trabajo, tareas, enlaces y finanzas. Entra con tu usuario y tu clave.</p>
    <label class="sr" for="usuario">Usuario</label>
    <input id="usuario" name="username" type="text" placeholder="Usuario" autocomplete="username" autocapitalize="off" spellcheck="false">
    <label class="sr" for="clave">Clave</label>
    <input id="clave" name="password" type="password" placeholder="Clave" autocomplete="current-password">
    <button class="btn" id="entrar" type="submit">Entrar</button>
    <p class="err hide" id="login-err" role="alert"></p>
  </form>
</section>

<div id="app" class="hide">
  <div class="win" id="win">
    <aside class="side" aria-label="Áreas">
      <img class="wm" src="assets/logo-michael-espinosa.png" alt="Michael Espinosa, estratega digital" width="150" height="42">
      <div class="cap">Panel de vida</div>
      <nav id="navs"></nav>
    </aside>
    <div class="col">
      <header class="topbar">
        <button class="sbtn" id="sbtn" type="button" aria-label="Buscar o saltar a"><span id="sbtn-i"></span><span class="tx">Buscar o saltar a…</span><kbd>⌘K</kbd></button>
        <button class="icon-btn" id="refresh" type="button" aria-label="Actualizar"></button>
        <button class="avb" id="avb" type="button" aria-label="Mi cuenta"><img id="avimg" src="assets/foto-perfil.jpg" alt=""></button>
        <div class="menu" id="menu"><button type="button" id="mfoto">Cambiar foto</button><button type="button" id="msalir">Cerrar sesión</button></div>
        <input type="file" id="file" accept="image/*" hidden>
      </header>
      <main id="view" class="main"></main>
    </div>
    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-label="Detalle del cliente"></aside>
  </div>
  <nav class="mnav" id="tabs" aria-label="Secciones"></nav>
</div>

<div class="modal" id="modal"><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt">
  <header class="mh"><div><h3 id="mt"></h3><small id="ms"></small></div><button class="x" id="mx" type="button" aria-label="Cerrar">&times;</button></header>
  <div class="mbody" id="mb"></div></div></div>

<div class="modal" id="tmodal"><form class="mbox tbox" id="tform" autocomplete="off">
  <header class="mh"><h3 id="tt">Nueva tarea</h3><button class="x" id="tx" type="button" aria-label="Cerrar">&times;</button></header>
  <div class="tfields">
    <div><label for="t-tarea">Tarea</label><input class="fi" id="t-tarea" type="text" maxlength="300" placeholder="¿Qué hay que hacer?" required></div>
    <div><label for="t-notas">Notas</label><textarea class="fi" id="t-notas" rows="3" maxlength="1000" placeholder="Opcional"></textarea></div>
    <div class="trow"><div><label for="t-fecha">Fecha límite</label><input class="fi" id="t-fecha" type="date"></div>
    <div><label for="t-prio">Prioridad</label><select class="fi" id="t-prio"><option value="alta">Alta</option><option value="media" selected>Media</option><option value="baja">Baja</option></select></div></div>
    <div><label for="t-cli">Cliente</label><select class="fi" id="t-cli"></select></div>
  </div>
  <footer class="tfoot"><button class="pill" id="tc" type="button">Cancelar</button><button class="btn sm" type="submit">Guardar</button></footer>
</form></div>
<div class="modal" id="nmodal"><form class="mbox tbox" id="nform" autocomplete="off">
  <header class="mh"><h3 id="nt">Nueva nota</h3><button class="x" id="nx" type="button" aria-label="Cerrar">&times;</button></header>
  <div class="tfields">
    <div><label for="n-titulo">Título</label><input class="fi" id="n-titulo" type="text" maxlength="200" placeholder="Ej. Reunión Compensar, ajustes de pauta" required></div>
    <div><label for="n-texto">Nota</label><textarea class="fi" id="n-texto" rows="9" maxlength="20000" placeholder="Escribe lo que quieras. En la bitácora se lee como markdown (listas con -, **negrita**)"></textarea></div>
    <div class="trow"><div><label for="n-etq">Etiqueta</label><select class="fi" id="n-etq"></select></div>
    <div><label for="n-cli">Cliente</label><select class="fi" id="n-cli"></select></div></div>
    <label class="ck" id="n-envf" hidden><input type="checkbox" id="n-env"> <span id="n-envt"></span></label>
  </div>
  <footer class="tfoot"><button class="pill" id="n-arch" type="button" hidden>Archivar</button><span class="grow"></span><button class="pill" id="nc" type="button">Cancelar</button><button class="btn sm" id="n-ok" type="submit">Guardar</button></footer>
</form></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="pal" id="pal"><div class="palbox"><div class="palin"><span id="pal-i"></span><input id="pq" type="search" placeholder="Cliente, plataforma, portal…" autocomplete="off" aria-label="Buscar"></div><div id="plist"></div></div></div>

<script src="assets/app.js"></script>
<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
